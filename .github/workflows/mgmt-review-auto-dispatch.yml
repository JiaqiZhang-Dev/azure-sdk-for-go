name: Mgmt Review Auto Dispatch

on:
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [Verify Links]
    types: [completed]

permissions: {}

concurrency:
  group: mgmt-review-dispatch-${{ github.event.check_suite.head_sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      (github.event_name == 'check_suite' && github.event.check_suite.repository.id == github.repository_id) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.repository.id == github.repository_id && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted routing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: eng/tools/pr-review
      - name: Dispatch management review when CI is complete
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { dispatchReadyReviews } = require('./eng/tools/pr-review/review-request.cjs');
            await dispatchReadyReviews({ github, context, core });
